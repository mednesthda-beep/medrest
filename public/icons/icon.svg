<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#2563eb" stroke-opacity="0.3" stroke-width="4" />

  <!-- Ambient Glow Behind Shield / Pillow -->
  <circle cx="256" cy="256" r="140" fill="#2563eb" opacity="0.22" filter="url(#glow)" />
  <circle cx="290" cy="220" r="80" fill="#ef4444" opacity="0.18" filter="url(#glow)" />

  <!-- Smart Pillow / Guardian Shield Outline -->
  <path d="M 256 96 
           C 336 96 400 136 400 236 
           C 400 336 296 396 256 424 
           C 216 396 112 336 112 236 
           C 112 136 176 96 256 96 Z"
        fill="#1e293b" 
        fill-opacity="0.8" 
        stroke="url(#primaryGrad)" 
        stroke-width="12" 
        stroke-linejoin="round"
        filter="url(#subtleGlow)" />

  <!-- Smart Pillow Ergonomic Contour Curves -->
  <path d="M 160 210 Q 256 160 352 210" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-width="5" 
        stroke-linecap="round" 
        opacity="0.5" />

  <path d="M 175 250 Q 256 210 337 250" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-width="3" 
        stroke-linecap="round" 
        opacity="0.3" />

  <!-- Pulsing ECG Heartbeat Wave -->
  <path d="M 145 285 
           L 205 285 
           L 225 240 
           L 245 330 
           L 270 205 
           L 295 310 
           L 315 285 
           L 367 285" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#subtleGlow)" />

  <!-- Glowing Heart Indicator at Peak -->
  <path d="M 270 190 
           C 270 180 258 172 248 178 
           C 240 184 240 194 270 216 
           C 300 194 300 184 292 178 
           C 282 172 270 180 270 190 Z" 
        fill="url(#heartGrad)" 
        filter="url(#glow)" />

  <!-- Smart IoT Connection Indicator -->
  <circle cx="370" cy="140" r="10" fill="#22c55e" filter="url(#subtleGlow)" />
  <circle cx="370" cy="140" r="16" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.6" />
  <circle cx="370" cy="140" r="24" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.3" />
</svg>
